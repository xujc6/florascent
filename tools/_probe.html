<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>
const q = new URLSearchParams(location.search);
const img = new Image();
img.onload = ()=>{
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img,0,0);
  const W=c.width,H=c.height;
  const d = g.getImageData(0,0,W,H).data;
  const cx = +(q.get('cx')||W/2), cy = +(q.get('cy')||H/2);
  const R = +(q.get('r')||90);
  // 白色像素聚类 = 花瓣
  const set = new Set(); const pts=[];
  for(let y=Math.max(0,cy-R); y<Math.min(H,cy+R); y++){
    for(let x=Math.max(0,cx-R); x<Math.min(W,cx+R); x++){
      const i=(y*W+x)*4;
      if(d[i]>238 && d[i+1]>238 && d[i+2]>238){ set.add(x+','+y); pts.push([x,y]); }
    }
  }
  const seen=new Set(); const cl=[];
  for(const [x,y] of pts){
    const k=x+','+y; if(seen.has(k)) continue;
    const st=[[x,y]]; seen.add(k); let n=0,sx=0,sy=0,x0=1e9,x1=-1,y0=1e9,y1=-1;
    while(st.length){
      const [u,v]=st.pop(); n++; sx+=u; sy+=v;
      if(u<x0)x0=u; if(u>x1)x1=u; if(v<y0)y0=v; if(v>y1)y1=v;
      for(const [du,dv] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const kk=(u+du)+','+(v+dv);
        if(set.has(kk) && !seen.has(kk)){ seen.add(kk); st.push([u+du,v+dv]); }
      }
    }
    cl.push({n, w:x1-x0+1, h:y1-y0+1, cx:+(sx/n).toFixed(1), cy:+(sy/n).toFixed(1)});
  }
  cl.sort((a,b)=>b.n-a.n);
  const top = cl.slice(0,6).map(o=>({w:o.w,h:o.h,d:+Math.hypot(o.cx-cx,o.cy-cy).toFixed(1)}));
  document.title = 'PROBE '+JSON.stringify({W,H,cx,cy,top});
};
img.src = q.get('src');
</script></body></html>
